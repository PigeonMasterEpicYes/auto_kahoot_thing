<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Local Testing Environment</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .log-box { border: 1px solid #ccc; padding: 10px; height: 150px; overflow-y: auto; background: #fafafa; font-family: monospace; }
        .btn { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Local Development Interface</h1>
    <p>Connected to machine pipeline via port 8080</p>

    <button id="test-btn" class="btn">Execute Local Request</button>

    <h3>Telemetry Feed</h3>
    <div id="log" class="log-box">Awaiting execution...</div>

    <script>
        const logEl = document.getElementById('log');
        
        document.getElementById('test-btn').addEventListener('click', async function() {
            // Generate a random ID between 1 and 100 to feed into the test API
            const randomId = Math.floor(Math.random() * 100) + 1;
            logEl.innerHTML += '<div>[' + new Date().toLocaleTimeString() + '] Dispatching request for ID: ' + randomId + '</div>';

            try {
                // Communicates directly with your local server endpoint
                const res = await fetch('http://localhost:8080/api/check/' + randomId);
                const data = await res.json();
                
                logEl.innerHTML += '<div style="color: green;">Response Received! Status: ' + data.status + '</div>';
                logEl.scrollTop = logEl.scrollHeight;
            } catch (err) {
                logEl.innerHTML += '<div style="color: red;">Connection Error: ' + err.message + '</div>';
            }
        });
    </script>
</body>
</html>
