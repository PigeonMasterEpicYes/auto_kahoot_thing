<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kahoot Code Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn-start { background-color: #28a745; color: white; }
        .btn-stop { background-color: #dc3545; color: white; }
        .btn-clear { background-color: #6c757d; color: white; }
        .log-container {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: monospace;
        }
        .log-entry { margin-bottom: 5px; }
        .valid { color: #28a745; }
        .invalid { color: #dc3545; }
    </style>
</head>
<body>

    <h1>Kahoot Code Scanner</h1>
    <p>Live Network Request Mode</p>

    <div class="stats">
        <div>Total: <span id="total-count">0</span></div>
        <div>Valid: <span id="valid-count" class="valid">0</span></div>
        <div>Invalid: <span id="invalid-count" class="invalid">0</span></div>
    </div>

    <div style="margin-bottom: 20px;">
        <button id="start-btn" class="btn btn-start">▶ Start</button>
        <button id="stop-btn" class="btn btn-stop" disabled>■ Stop</button>
        <button id="clear-btn" class="btn btn-clear">Clear</button>
    </div>

    <h2>Activity Log</h2>
    <div id="log" class="log-container">
        <div class="log-entry">Scanner ready...</div>
    </div>

    <script>
        let isScanning = false;
        let total = 0;
        let valid = 0;
        let invalid = 0;
        let scanInterval;

        const totalEl = document.getElementById('total-count');
        const validEl = document.getElementById('valid-count');
        const invalidEl = document.getElementById('invalid-count');
        const logEl = document.getElementById('log');
        
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');
        const clearBtn = document.getElementById('clear-btn');

        function addLog(text, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
            logEl.appendChild(entry);
            logEl.scrollTop = logEl.scrollHeight; // Auto-scroll to bottom
        }

        // Generates a random 7-digit Kahoot PIN string
        function generateRandomPin() {
            return Math.floor(1000000 + Math.random() * 9000000).toString();
        }

        async function testCode() {
            if (!isScanning) return;

            const pin = generateRandomPin();
            total++;
            totalEl.innerText = total;

            // FIX: Route the request through a public CORS proxy to bypass browser restrictions
            const targetUrl = `https://kahoot.it{pin}`;
            const proxyUrl = `https://corsproxy.io{encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                
                if (response.status === 200) {
                    valid++;
                    validEl.innerText = valid;
                    addLog(`SUCCESS: Found valid PIN ${pin}`, 'valid');
                } else {
                    invalid++;
                    invalidEl.innerText = invalid;
                    addLog(`Tested PIN ${pin} - Status: ${response.status}`, 'invalid');
                }
            } catch (error) {
                // Public proxies can sometimes hit rate limits
                invalid++;
                invalidEl.innerText = invalid;
                addLog(`ERROR testing PIN ${pin} (Proxy busy or network error)`, 'invalid');
            }
        }

        startBtn.addEventListener('click', () => {
            isScanning = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;
            addLog('Scanner started...');
            
            // Tests 1 code every 1.5 seconds to avoid flooding the public proxy
            scanInterval = setInterval(testCode, 1500); 
        });

        stopBtn.addEventListener('click', () => {
            isScanning = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            clearInterval(scanInterval);
            addLog('Scanner stopped.');
        });

        clearBtn.addEventListener('click', () => {
            total = 0;
            valid = 0;
            invalid = 0;
            totalEl.innerText = '0';
            validEl.innerText = '0';
            invalidEl.innerText = '0';
            logEl.innerHTML = '<div class="log-entry">Cleared logs. Scanner ready...</div>';
        });
    </script>
</body>
</html>
