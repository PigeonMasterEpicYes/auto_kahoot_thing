<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kahoot Code Scanner</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top left, #253866 0%, transparent 35%),
                  radial-gradient(circle at bottom right, #382052 0%, transparent 35%),
                  #090e1c;
      color: white;
    }
    .app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    .header {
      height: 78px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: space-between; padding: 0 24px;
      background: rgba(17, 24, 44, 0.95); border-bottom: 1px solid #28324d;
    }
    .title { font-size: 23px; font-weight: 800; }
    .subtitle { color: #75809d; font-size: 12px; margin-top: 3px; }
    .stats { display: flex; gap: 9px; }
    .stat { background: #1b243d; padding: 8px 13px; border-radius: 8px; font-size: 13px; }
    .valid-stat { color: #4bea94; }
    .invalid-stat { color: #ff6378; }
    .main { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 18px 20px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .toolbar h2 { margin: 0; font-size: 18px; }
    .buttons { display: flex; gap: 8px; }
    button {
      border: none; border-radius: 9px; padding: 10px 15px; color: white;
      font-weight: 700; cursor: pointer; transition: transform 0.15s, filter 0.15s, opacity 0.15s;
    }
    button:hover { transform: translateY(-1px); filter: brightness(1.12); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .start { background: linear-gradient(135deg, #6558ff, #875cff); }
    .stop { background: #8e293d; }
    .export { background: #29344f; }
    .clear { background: #5e2432; }
    .status-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; color: #8b96b2; font-size: 13px; }
    .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #65708c; }
    .status-dot.running { background: #4bea94; box-shadow: 0 0 12px rgba(75, 234, 148, 0.7); animation: pulse 1s infinite; }
    #log { flex: 1; min-height: 0; overflow-y: auto; padding-right: 5px; }
    .log-entry {
      display: grid; grid-template-columns: 150px 140px 1fr 150px;
      align-items: center; min-height: 60px; margin-bottom: 8px; padding: 0 18px;
      border-radius: 10px; animation: appear 0.18s ease;
    }
    .log-entry.valid { background: rgba(54, 217, 130, 0.11); border-left: 4px solid #36d982; }
    .log-entry.invalid { background: rgba(255, 77, 103, 0.11); border-left: 4px solid #ff4d67; }
    .code { font-family: monospace; font-size: 18px; font-weight: 800; letter-spacing: 3px; }
    .result.valid { color: #4bea94; }
    .result.invalid { color: #ff6378; }
    .url { color: #71809f; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: monospace; font-size: 11px; }
    .time { color: #77819d; text-align: right; font-family: monospace; font-size: 12px; }
    .empty { height: 100%; display: flex; align-items: center; justify-content: center; color: #5d6883; font-size: 17px; }
    #log::-webkit-scrollbar { width: 8px; }
    #log::-webkit-scrollbar-track { background: #0e1527; border-radius: 10px; }
    #log::-webkit-scrollbar-thumb { background: #35405d; border-radius: 10px; }
    @keyframes appear { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.35; } 100% { opacity: 1; } }
  </style>
</head>
<body>

<div class="app">
  <header class="header">
    <div>
      <div class="title">Kahoot Scanner</div>
      <div class="subtitle">Live Network Request Mode</div>
    </div>
    <div class="stats">
      <div class="stat">Total: <span id="total">0</span></div>
      <div class="stat valid-stat">Valid: <span id="valid">0</span></div>
      <div class="stat invalid-stat">Invalid: <span id="invalid">0</span></div>
    </div>
  </header>

  <main class="main">
    <div class="toolbar">
      <h2>Activity Log</h2>
      <div class="buttons">
        <button class="start" id="startButton" onclick="startScanner()">▶ Start</button>
        <button class="stop" id="stopButton" onclick="stopScanner()" disabled>■ Stop</button>
        <button class="export" onclick="exportCSV()">Export</button>
        <button class="clear" onclick="clearLog()">Clear</button>
      </div>
    </div>

    <div class="status-bar">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Scanner stopped</span>
    </div>

    <div id="log">
      <div class="empty" id="empty">No codes tested yet.</div>
    </div>
  </main>
</div>

<script>
  let results = [];
  let total = 0;
  let valid = 0;
  let invalid = 0;
  let scanning = false;

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function checkKahootCode(pin) {
    const url = `https://kahoot.it/reserve/session/${pin}`;
    try {
      // Note: Direct browser requests to kahoot.it may trigger CORS errors 
      // unless handled via a backend proxy or extension.
      const response = await fetch(url, { method: 'GET', mode: 'cors' });
      // If the endpoint returns a valid status (e.g., 200), the session exists.
      return { isValid: response.ok, url };
    } catch (error) {
      // Fallback behavior if CORS or network blocks the direct fetch
      console.warn("Network/CORS restriction encountered:", error);
      return { isValid: false, url };
    }
  }

  async function generateAndTestCode() {
    const code = Math.floor(100000 + Math.random() * 900000).toString();
    
    total++;
    updateStats();

    // Perform actual asynchronous check
    const checkResult = await checkKahootCode(code);
    const isValid = checkResult.isValid;

    if (isValid) {
      valid++;
    } else {
      invalid++;
    }

    results.push({
      code: code,
      result: isValid ? "VALID" : "INVALID",
      url: checkResult.url,
      time: new Date().toLocaleTimeString()
    });

    updateStats();
    addLogEntry(code, isValid, checkResult.url);
  }

  function addLogEntry(code, isValid, kahootUrl) {
    const log = document.getElementById("log");
    const empty = document.getElementById("empty");
    if (empty) empty.remove();

    const entry = document.createElement("div");
    entry.className = "log-entry " + (isValid ? "valid" : "invalid");
    entry.innerHTML = `
      <div class="code">${code}</div>
      <div class="result ${isValid ? "valid" : "invalid"}">${isValid ? "✓ VALID" : "✕ INVALID"}</div>
      <div class="url" title="${kahootUrl}">${kahootUrl}</div>
      <div class="time">${new Date().toLocaleTimeString()}</div>
    `;
    log.prepend(entry);
  }

  function updateStats() {
    document.getElementById("total").textContent = total;
    document.getElementById("valid").textContent = valid;
    document.getElementById("invalid").textContent = invalid;
  }

  async function startScanner() {
    if (scanning) return;
    scanning = true;

    document.getElementById("startButton").disabled = true;
    document.getElementById("stopButton").disabled = false;
    document.getElementById("statusText").textContent = "Scanner running";
    document.getElementById("statusDot").classList.add("running");

    while (scanning) {
      await generateAndTestCode();
      if (!scanning) break;
      // Added a slight delay between requests to avoid rapid spamming
      await wait(1000); 
    }
  }

  function stopScanner() {
    scanning = false;
    document.getElementById("startButton").disabled = false;
    document.getElementById("stopButton").disabled = true;
    document.getElementById("statusText").textContent = "Scanner stopped";
    document.getElementById("statusDot").classList.remove("running");
  }

  function clearLog() {
    stopScanner();
    results = [];
    total = 0;
    valid = 0;
    invalid = 0;
    updateStats();
    document.getElementById("log").innerHTML = `<div class="empty" id="empty">No codes tested yet.</div>`;
  }

  function exportCSV() {
    if (results.length === 0) {
      alert("There are no results to export.");
      return;
    }
    let csv = "Code,Result,Kahoot URL,Time\n";
    results.forEach(row => {
      csv += `"${row.code}","${row.result}","${row.url}","${row.time}"\n`;
    });
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "code-log.csv";
    link.click();
    URL.revokeObjectURL(url);
  }
</script>

</body>
</html>
